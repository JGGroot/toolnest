name: Deploy Toolnest to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.source.outputs.build_type }}
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Read Pages source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "build_type=$(gh api repos/${{ github.repository }}/pages --jq .build_type)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        if: steps.source.outputs.build_type == 'workflow'
      - uses: actions/upload-pages-artifact@v3
        if: steps.source.outputs.build_type == 'workflow'
        with:
          path: dist

  deploy:
    needs: verify
    if: needs.verify.outputs.build_type == 'workflow'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
